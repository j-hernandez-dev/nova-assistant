[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "local-cli"
version = "0.13.0"
description = "Nova: local AI assistant for projects, sources and memories"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["pypdf==6.19.0", "numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/j-hernandez-dev/nova-assistant"
Repository = "https://github.com/j-hernandez-dev/nova-assistant"

[project.optional-dependencies]
browser = ["playwright==1.64.0"]
# Compatibility extra; NumPy is included for the Memory settings feature.
memory-semantic = ["numpy>=1.24"]

[project.scripts]
local-cli = "local_cli.__main__:main"

[tool.setuptools.packages.find]
include = ["local_cli*"]
