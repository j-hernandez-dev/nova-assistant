name: Nova Knowledge V1 and Desktop contracts
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  knowledge-contracts:
    name: Current portable Knowledge contracts (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.longpaths
          GIT_CONFIG_VALUE_1: 'true'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e . pytest pytest-subtests
      - name: Reject unclassified or removed contracts
        run: python -B ci/contract_inventory.py
      - name: Validate positive collection before test execution
        run: >-
          python -B ci/run_contracts.py --job knowledge --collect-only
          --output "${{ runner.temp }}/nova-knowledge-collection"
      - name: Knowledge positive current regression (no real model)
        run: >-
          python -B ci/run_contracts.py --job knowledge
          --output "${{ runner.temp }}/nova-knowledge-contracts"
      - name: Preserve current CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-current-contracts-windows
          path: |
            ${{ runner.temp }}/nova-knowledge-collection/public/run.json
            ${{ runner.temp }}/nova-knowledge-collection/public/selection.json
            ${{ runner.temp }}/nova-knowledge-collection/public/collected_nodeids.json
            ${{ runner.temp }}/nova-knowledge-collection/public/pytest.log
            ${{ runner.temp }}/nova-knowledge-contracts/public/run.json
            ${{ runner.temp }}/nova-knowledge-contracts/public/selection.json
            ${{ runner.temp }}/nova-knowledge-contracts/public/collected_nodeids.json
            ${{ runner.temp }}/nova-knowledge-contracts/public/tests.xml
            ${{ runner.temp }}/nova-knowledge-contracts/public/pytest.log
          if-no-files-found: error

  desktop-contracts:
    name: Desktop ordinary contracts (no GUI or packaging)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.longpaths
          GIT_CONFIG_VALUE_1: 'true'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci
      - name: Nine ordinary Desktop contract suites including Web V1.2
        run: >-
          node --experimental-transform-types --test
          tests/application_client.test.cjs
          tests/approval_host.test.cjs
          tests/security_audit.test.cjs
          tests/memory_control.test.cjs
          tests/memory_maintenance.test.cjs
          tests/knowledge_control.test.cjs
          tests/knowledge_k7.test.cjs
          tests/active_web.test.cjs
          tests/web_v12.test.cjs
      - name: Desktop static TypeScript contract
        run: npx --no-install tsc --noEmit
      - name: Desktop source build check without installer or release
        run: node ../ci/desktop_build_check.cjs "${{ runner.temp }}/nova-desktop-build"
