name: Nova legacy Active Web portable regression
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  active-web-contracts:
    name: Active Web contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.longpaths
          GIT_CONFIG_VALUE_1: 'true'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e . pytest pytest-subtests
      - run: python -B ci/contract_inventory.py
      - name: Positive portable contracts, no installed browser or real model
        run: python -B ci/run_contracts.py --job active-web --output "${{ runner.temp }}/nova-active-web"
      - name: Preserve current diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active-web-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/nova-active-web/public/run.json
            ${{ runner.temp }}/nova-active-web/public/selection.json
            ${{ runner.temp }}/nova-active-web/public/collected_nodeids.json
            ${{ runner.temp }}/nova-active-web/public/tests.xml
            ${{ runner.temp }}/nova-active-web/public/pytest.log
          if-no-files-found: error

