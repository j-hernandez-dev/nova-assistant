name: Nova Core V1 contracts
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      native_security:
        description: Explicit private Windows/NTFS Security host contracts (no model)
        required: false
        type: boolean
        default: false
      native_symlink:
        description: Explicit Windows symlink contracts; unavailable privilege fails without elevation
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  core-contracts:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.longpaths
          GIT_CONFIG_VALUE_1: 'true'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e . pytest pytest-subtests
      - name: Require complete contract classification
        run: python -B ci/contract_inventory.py
      - name: Core positive current regression
        run: >-
          python -B ci/run_contracts.py --job core
          --output "${{ runner.temp }}/nova-core-contracts"
      - name: Preserve current CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-contracts-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/nova-core-contracts/public/run.json
            ${{ runner.temp }}/nova-core-contracts/public/selection.json
            ${{ runner.temp }}/nova-core-contracts/public/collected_nodeids.json
            ${{ runner.temp }}/nova-core-contracts/public/tests.xml
            ${{ runner.temp }}/nova-core-contracts/public/pytest.log
          if-no-files-found: error

  security-contracts:
    name: Security contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.longpaths
          GIT_CONFIG_VALUE_1: 'true'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        # The existing Python/Node proof contract needs Node, not Desktop/GUI.
        with:
          node-version: '24.19.0'
      - run: python -m pip install -e . pytest pytest-subtests
      - name: Security positive current regression
        run: >-
          python -B ci/run_contracts.py --job security
          --output "${{ runner.temp }}/nova-security-contracts"
      - name: Preserve current CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-contracts-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/nova-security-contracts/public/run.json
            ${{ runner.temp }}/nova-security-contracts/public/selection.json
            ${{ runner.temp }}/nova-security-contracts/public/collected_nodeids.json
            ${{ runner.temp }}/nova-security-contracts/public/tests.xml
            ${{ runner.temp }}/nova-security-contracts/public/pytest.log
          if-no-files-found: error

  security-native-manual:
    name: Manual private Windows/NTFS Security host contracts
    # The original native scope is explicit and manual, never an ordinary skip.
    if: github.event_name == 'workflow_dispatch' && inputs.native_security
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.longpaths
          GIT_CONFIG_VALUE_1: 'true'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e . pytest pytest-subtests
      - name: Explicit positive native Security contracts
        run: >-
          python -B ci/run_contracts.py --job security-native --special
          --output "${{ runner.temp }}/nova-security-native"
      - name: Preserve native CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-native-windows
          path: |
            ${{ runner.temp }}/nova-security-native/public/run.json
            ${{ runner.temp }}/nova-security-native/public/selection.json
            ${{ runner.temp }}/nova-security-native/public/collected_nodeids.json
            ${{ runner.temp }}/nova-security-native/public/tests.xml
            ${{ runner.temp }}/nova-security-native/public/pytest.log
          if-no-files-found: error

  core-symlink-native-manual:
    name: Manual Windows symlink containment prerequisite and contracts
    if: github.event_name == 'workflow_dispatch' && inputs.native_symlink
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.longpaths
          GIT_CONFIG_VALUE_1: 'true'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e . pytest pytest-subtests
      - name: Require real owned Windows symlink creation; no privilege changes or skips
        run: >-
          python -B ci/run_contracts.py --job core-symlink-native --special
          --output "${{ runner.temp }}/nova-core-symlink-native"
      - name: Preserve sanitized symlink contract diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-symlink-native-windows
          path: |
            ${{ runner.temp }}/nova-core-symlink-native/public/run.json
            ${{ runner.temp }}/nova-core-symlink-native/public/selection.json
            ${{ runner.temp }}/nova-core-symlink-native/public/collected_nodeids.json
            ${{ runner.temp }}/nova-core-symlink-native/public/tests.xml
            ${{ runner.temp }}/nova-core-symlink-native/public/pytest.log
          if-no-files-found: error
