name: Nova Core V1 gates
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  native-backend:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e . pytest pytest-subtests
      - name: Architecture and real native process smoke
        run: python -m pytest tests/test_nova_core_phase14_architecture.py tests/test_nova_core_phase14_platform.py -q
      - name: Backend regression (no external LLM required)
        run: python -m pytest -q
